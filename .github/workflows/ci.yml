name: Stockwise CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend-build:
    name: Frontend build check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Cloud_inventory-main/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Install missing build dependencies
        run: npm install ajv@8.12.0 ajv-keywords@5.1.0 --legacy-peer-deps

      - name: Build frontend
        run: npm run build

  backend-dependencies:
    name: Backend dependency and import check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Cloud_inventory-main/backend

    env:
      DATABASE_URL: postgresql+asyncpg://ci_user:ci_password@localhost:5432/ci_db
      CORS_ORIGINS: "*"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify FastAPI app import
        run: |
          python -c "import server; print('Backend import check passed')"
